# ╭─────────────────────────Commonly Used ImplementationGuide Properties───────────────────────────╮
# │  The properties below are used to create the ImplementationGuide resource. The most commonly   │
# │  used properties are included. For a list of all supported properties and their functions,     │
# │  see: https://fshschool.org/docs/sushi/configuration/.                                         │
# ╰────────────────────────────────────────────────────────────────────────────────────────────────╯
# Use hl7se.* (not hl7.fhir.r4.ig.*): the latter triggers IG Publisher realm rules that require
# urn:iso:std:iso:3166#R4 on StructureDefinitions, which is not a valid ISO 3166 code for terminology validation.
id: hl7se.fhir.r4.ig.medicalalertinformation
canonical: http://hl7.se/fhir/r4/ig/medicalalertinformation
name: SEMedicalAlertInformationImplementationGuide
# title: Example Title
# description: Example Implementation Guide for getting started with SUSHI
status: draft # draft | active | retired | unknown
version: 0.1.0
fhirVersion: 4.0.1 # https://www.hl7.org/fhir/valueset-FHIR-version.html
copyrightYear: 2025+
releaseLabel: ci-build # ci-build | draft | qa-preview | ballot | trial-use | release | update | normative+trial-use
# license: CC0-1.0 # https://www.hl7.org/fhir/valueset-spdx-license.html
jurisdiction: urn:iso:std:iso:3166#SE "Sweden" # https://www.hl7.org/fhir/valueset-jurisdiction.html
publisher:
  name: HL7 Sweden
  url: http://hl7.se/
  email: info@hl7.se

# The dependencies property corresponds to IG.dependsOn. The key is the
# package id and the value is the version (or dev/current). For advanced
# use cases, the value can be an object with keys for id, uri, and version.
#
# dependencies:
#   hl7.fhir.us.core: 3.1.0
#   hl7.fhir.us.mcode:
#     id: mcode
#     uri: http://hl7.org/fhir/us/mcode/ImplementationGuide/hl7.fhir.us.mcode
#     version: 1.0.0
dependencies:
  hl7se.fhir.base: 1.1.0
  # Extensions from the FHIR extensions package (flag-detail, note) in the version published for R4
  hl7.fhir.uv.extensions.r4: 5.2.0

# The guide is written in English (without this the IG Publisher validated texts as sv-SE)
parameters:
  i18n-default-lang: en

#
#
# The pages property corresponds to IG.definition.page. SUSHI can
# auto-generate the page list, but if the author includes pages in
# this file, it is assumed that the author will fully manage the
# pages section and SUSHI will not generate any page entries.
# The page file name is used as the key. If title is not provided,
# then the title will be generated from the file name.  If a
# generation value is not provided, it will be inferred from the
# file name extension.  Any subproperties that are valid filenames
# with supported extensions (e.g., .md/.xml) will be treated as
# sub-pages.
#
pages:
  index.md:
  flags.md:
    title: Mapping from UMI
  use-cases.md:
    title: Use cases
  translations.md:
    title: Terminology and translations
#   index.md:
#     title: Example Home
#   implementation.xml:
#   examples.xml:
#     title: Examples Overview
#     simpleExamples.xml:
#     complexExamples.xml:
#
#
# The parameters property represents IG.definition.parameter. Rather
# than a list of code/value pairs (as in the ImplementationGuide
# resource), the code is the YAML key. If a parameter allows repeating
# values, the value in the YAML should be a sequence/array.
# For parameters defined by core FHIR see:
# http://build.fhir.org/codesystem-guide-parameter-code.html
# For parameters defined by the FHIR Tools IG see:
# http://build.fhir.org/ig/FHIR/fhir-tools-ig/branches/master/CodeSystem-ig-parameters.html
#
# parameters:
#   excludettl: true
#   validation: [allow-any-extensions, no-broken-links]
#
# ╭────────────────────────────────────────────menu.xml────────────────────────────────────────────╮
# │ The menu property will be used to generate the input/menu.xml file. The menu is represented    │
# │ as a simple structure where the YAML key is the menu item name and the value is the URL.       │
# │ The IG publisher currently only supports one level deep on sub-menus. To provide a             │
# │ custom menu.xml file, do not include this property and include a `menu.xml` file in            │
# │ input/includes. To use a provided input/includes/menu.xml file, delete the "menu"              │
# │ property below.                                                                                │
# ╰────────────────────────────────────────────────────────────────────────────────────────────────╯
menu:
  Home: index.html
  Mapping from UMI: flags.html
  Use cases: use-cases.html
  Terminology: translations.html
  Artifacts: artifacts.html

# ╭───────────────────────────Less Common Implementation Guide Properties──────────────────────────╮
# │  Uncomment the properties below to configure additional properties on the ImplementationGuide  │
# │  resource. These properties are less commonly needed than those above.                         │
# ╰────────────────────────────────────────────────────────────────────────────────────────────────╯
#
# Those who need more control or want to add additional details to the contact values can use
# contact directly and follow the format outlined in the ImplementationGuide resource and
# ContactDetail.
#
# contact:
#   - name: Bob Smith
#     telecom:
#       - system: email # phone | fax | email | pager | url | sms | other
#         value: bobsmith@example.org
#         use: work
#
#
# The global property corresponds to the IG.global property, but it
# uses the type as the YAML key and the profile as its value. Since
# FHIR does not explicitly disallow more than one profile per type,
# neither do we; the value can be a single profile URL or an array
# of profile URLs. If a value is an id or name, SUSHI will replace
# it with the correct canonical when generating the IG JSON.
#
# global:
#   Patient: http://example.org/fhir/StructureDefinition/my-patient-profile
#   Encounter: http://example.org/fhir/StructureDefinition/my-encounter-profile
#
#
# The resources property corresponds to IG.definition.resource.
# SUSHI can auto-generate all of the resource entries based on
# the FSH definitions and/or information in any user-provided
# JSON or XML resource files. If the generated entries are not
# sufficient or complete, however, the author can add entries
# here. If the reference matches a generated entry, it will
# replace the generated entry. If it doesn't match any generated
# entries, it will be added to the generated entries. The format
# follows IG.definition.resource with the following differences:
#   * use IG.definition.resource.reference.reference as the YAML key.
#   * if the key is an id or name, SUSHI will replace it with the
#     correct URL when generating the IG JSON.
#   * specify "omit" to omit a FSH-generated resource from the
#     resource list.
#   * if the exampleCanonical is an id or name, SUSHI will replace
#     it with the correct canonical when generating the IG JSON.
#   * groupingId can be used, but top-level groups syntax may be a
#     better option (see below).
# The following are simple examples to demonstrate what this might
# look like:
#
# resources:
#   Patient/my-example-patient:
#     name: My Example Patient
#     description: An example Patient
#     exampleBoolean: true
#   Patient/bad-example: omit
#
#
# Groups can control certain aspects of the IG generation.  The IG
# documentation recommends that authors use the default groups that
# are provided by the templating framework, but if authors want to
# use their own instead, they can use the mechanism below.  This will
# create IG.definition.grouping entries and associate the individual
# resource entries with the corresponding groupIds. If a resource
# is specified by id or name, SUSHI will replace it with the correct
# URL when generating the IG JSON.
#
# groups:
#   GroupA:
#     name: Group A
#     description: The Alpha Group
#     resources:
#     - StructureDefinition/animal-patient
#     - StructureDefinition/arm-procedure
#   GroupB:
#     name: Group B
#     description: The Beta Group
#     resources:
#     - StructureDefinition/bark-control
#     - StructureDefinition/bee-sting
#
#
# The ImplementationGuide resource defines several other properties
# not represented above. These properties can be used as-is and
# should follow the format defined in ImplementationGuide:
# * date
# * meta
# * implicitRules
# * language
# * text
# * contained
# * extension
# * modifierExtension
# * experimental
# * useContext
# * copyright
# * packageId
#
#
# ╭──────────────────────────────────────────SUSHI flags───────────────────────────────────────────╮
# │  The flags below configure aspects of how SUSHI processes FSH.                                 │
# ╰────────────────────────────────────────────────────────────────────────────────────────────────╯
# The FSHOnly flag indicates if only FSH resources should be exported.
# If set to true, no IG related content will be generated.
# The default value for this property is false.
#
# FSHOnly: false
#
#
# When set to true, the "short" and "definition" field on the root element of an Extension will
# be set to the "Title" and "Description" of that Extension. Default is true.
#
# applyExtensionMetadataToRoot: true
#
#
# The instanceOptions property is used to configure certain aspects of how SUSHI processes instances.
# See the individual option definitions below for more detail.
#
# Groups on the Artifacts page. The value sets follow the groups and subgroups of the code list for medical alert information.
groups:
  BaseProfile:
    name: "Base profile"
    description: "The profile that holds the requirements common to all medical alert information. The profiles for the subgroups are derived from it."
    resources:
      - StructureDefinition/SEAlertInformationFlag
  SubgroupProfiles:
    name: "Profiles for the subgroups of medical alert information"
    description: "One profile per subgroup of medical alert information, numbered as on the page Mapping from UMI."
    resources:
      - StructureDefinition/SEAlertInformation-1-OtherMedicalConditionFlag
      - StructureDefinition/SEAlertInformation-2-TreatmentFlag
      - StructureDefinition/SEAlertInformation-3-PresenceOfTransplantFlag
      - StructureDefinition/SEAlertInformation-4-PresenceOfImplantFlag
      - StructureDefinition/SEAlertInformation-5-PresenceOfInfectiousAgentFlag
      - StructureDefinition/SEAlertInformation-6-PresenceOfInfectiousDiseaseFlag
      - StructureDefinition/SEAlertInformation-7-HypersensitivityFlag
      - StructureDefinition/SEAlertInformation-8-InformationSpecialCareRoutineFlag
      - StructureDefinition/SEAlertInformation-9-DecisionSpecialCareRoutineFlag
      - StructureDefinition/SEAlertInformation-10-UncategorizedFlag
  Extensions:
    name: "Extensions"
    description: "Extensions defined in this guide. The base profile also uses the extensions note (comment), flag-priority and flag-detail from the FHIR extensions package."
    resources:
      - StructureDefinition/SeverityLevel
      - StructureDefinition/VerificationStatus
      - StructureDefinition/DecisionDescription
  ValueSetsMedicalConditions:
    name: "Value sets: Medical conditions and treatments"
    description: "Value sets for other medical condition, treatment, presence of implant and presence of transplant, in the order of the code list for medical alert information."
    resources:
      - ValueSet/1.2.752.116.3.1.16.1.1
      - ValueSet/1.2.752.116.3.1.16.1.1.1
      - ValueSet/59821000052101
      - ValueSet/1.2.752.116.3.1.16.1.2
      - ValueSet/1.2.752.116.3.1.16.1.2.1
      - ValueSet/59831000052104
      - ValueSet/1.2.752.116.3.1.16.1.2.2
      - ValueSet/1.2.752.116.3.1.16.1.3
      - ValueSet/1.2.752.116.3.1.16.1.3.1
      - ValueSet/59841000052105
      - ValueSet/1.2.752.116.3.1.16.1.4
      - ValueSet/1.2.752.116.3.1.16.1.4.1
      - ValueSet/113471000052100
      - ValueSet/59861000052106
  ValueSetsInfection:
    name: "Value sets: Infection"
    description: "Value sets for presence of infectious agent and presence of infectious disease, in the order of the code list for medical alert information."
    resources:
      - ValueSet/1.2.752.116.3.1.16.1.5
      - ValueSet/59851000052108
      - ValueSet/1.2.752.116.3.1.16.1.6
      - ValueSet/1.2.752.116.3.1.16.1.6.1
      - ValueSet/60661000052106
  ValueSetsHypersensitivity:
    name: "Value sets: Hypersensitivity"
    description: "Value sets for hypersensitivity, including its subgroups, severity level and verification status."
    resources:
      - ValueSet/SEAlertInformationHypersensitivityVS
      - ValueSet/59871000052102
      - ValueSet/SEAlertInformationHypersensitivitySubgroupVS
      - ValueSet/SEAlertInformationSeverityLevelVS
      - ValueSet/SEAlertInformationVerificationStatusVS
  ValueSetsSpecialCareRoutine:
    name: "Value sets: Special care routine"
    description: "Value sets for information and decisions that can lead to a special care routine."
    resources:
      - ValueSet/59881000052100
      - ValueSet/103491000052103
  ValueSetsGeneral:
    name: "Value sets used by all profiles"
    description: "The main groups and subgroups of medical alert information."
    resources:
      - ValueSet/SEAlertInformationCategoryVS
      - ValueSet/SEAlertInformationMainGroupVS
      - ValueSet/SEAlertInformationSubgroupVS
  CodeSystems:
    name: "Code systems"
    description: "Code systems defined in this guide. The codes are defined in the code systems; the profiles and extensions bind to the value sets."
    resources:
      - CodeSystem/SEAlertInformationCategoryCS
      - CodeSystem/SEAlertInformationSeverityLevelCS
      - CodeSystem/SEAlertInformationICD10SECS
      - CodeSystem/SEAlertInformationNationalSnomedCS
  ConceptMaps:
    name: "Concept maps"
    description: "Concept maps defined in this guide."
    resources:
      - ConceptMap/SEAlertInformationInfectiousAgentSnomedToICD10SE
  Examples:
    name: "Examples"
    description: "Example instances of the profiles."
    resources:
      - Flag/SEAlertInformationFlagExample
      - Flag/SEAlertInformationOtherMedicalConditionFlagExample
      - Flag/SEAlertInformationTreatmentFlagExample
      - Flag/SEAlertInformation-3-PresenceOfTransplantFlagExample
      - Flag/SEAlertInformation-4-PresenceOfImplantFlagExample
      - Flag/SEAlertInformation-5-PresenceOfInfectiousAgentFlagExample
      - Flag/SEAlertInformation-6-PresenceOfInfectiousDiseaseFlagExample
      - Flag/SEAlertInformation-7-HypersensitivityFlagExample
      - Flag/SEAlertInformation-8-InformationSpecialCareRoutineFlagExample
      - Flag/SEAlertInformation-9-DecisionSpecialCareRoutineFlagExample
      - Flag/SEAlertInformation-10-UncategorizedFlagExample
      - Patient/PatientExample1

instanceOptions:
  # When set to true, slices must be referred to by name and not only by a numeric index in order to be used
  # in an Instance's assignment rule. All slices appear in the order in which they are specified in FSH rules.
  # While SUSHI defaults to false for legacy reasons, manualSliceOrding is recommended for new projects.
  manualSliceOrdering: true # true | false
  # Determines for which types of Instances SUSHI will automatically set meta.profile
  # if InstanceOf references a profile:
  #
  # setMetaProfile: always # always | never | inline-only | standalone-only
  #
  #
  # Determines for which types of Instances SUSHI will automatically set id
  # if InstanceOf references a profile:
  #
  # setId: always # always | standalone-only
